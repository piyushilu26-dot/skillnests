name: Configure career resource access

on:
  push:
    paths:
      - .github/workflows/patch-career-resource-access.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow two career resources for free users
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/career-guidance.tsx')
          text = path.read_text()
          old = 'index === 0 ? (isDriveUrl(item.documentUrl)'
          new = 'index < 2 ? (isDriveUrl(item.documentUrl)'
          if old not in text:
              raise SystemExit('Expected career resource gate was not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/career-guidance.tsx
          git commit -m "Allow two career PDFs free and gate the rest" || exit 0
          git push