name: Generate MUN committee PDFs
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/mun-committee-pdfs/**"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: pip install reportlab
      - name: Generate separate committee PDFs
        run: python scripts/generate_mun_pdfs.py
      - name: Add committee guide links to MUN Topics & Blocs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/routes/_authenticated/mun.tsx")
          s=p.read_text(encoding="utf-8")
          if 'const committeeGuides = [' not in s:
              data='''const committeeGuides = [
            { code: "UNGA", name: "United Nations General Assembly", category: "General Assembly" },
            { code: "UNSC", name: "United Nations Security Council", category: "Security" },
            { code: "UNHRC", name: "United Nations Human Rights Council", category: "Human Rights" },
            { code: "ECOSOC", name: "United Nations Economic and Social Council", category: "Economic & Social" },
            { code: "WHO", name: "World Health Organization", category: "Specialized Agency" },
            { code: "UNEP", name: "United Nations Environment Programme", category: "Environment" },
            { code: "UN Women", name: "UN Women", category: "Specialized Agency" },
            { code: "UNICEF", name: "United Nations Children's Fund", category: "Specialized Agency" },
            { code: "UNESCO", name: "UNESCO", category: "Specialized Agency" },
            { code: "UNODC", name: "United Nations Office on Drugs and Crime", category: "Specialized Agency" },
            { code: "UN-Habitat", name: "UN-Habitat", category: "Specialized Agency" },
            { code: "ILO", name: "International Labour Organization", category: "Specialized Agency" },
            { code: "UNSC Crisis", name: "UN Security Council Crisis", category: "Crisis" },
            { code: "ICC", name: "International Crisis Committee", category: "Crisis" },
            { code: "Historical Crisis", name: "Historical Crisis Committee", category: "Crisis" },
            { code: "JCC", name: "Joint Crisis Committee", category: "Crisis" },
            { code: "Cabinet-War Cabinet", name: "Cabinet / War Cabinet", category: "Crisis" },
            { code: "International Press", name: "International Press / Media Corps", category: "Media" },
            { code: "Lok Sabha", name: "Lok Sabha", category: "Indian Parliament" },
            { code: "Rajya Sabha", name: "Rajya Sabha", category: "Indian Parliament" },
            { code: "AIPPM", name: "All India Political Parties Meet", category: "Indian Parliament" },
            { code: "Indian Cabinet", name: "Indian Cabinet Simulation", category: "Indian Executive" },
            { code: "State Assembly", name: "State Legislative Assembly", category: "Indian Parliament" },
          ];

          '''
              s=s.replace('function MunPage() {',data+'function MunPage() {',1)
              old='{isAdmin && <AdminForm />}\n            <Grid items={items} isAdmin={isAdmin} />'
              new='''{isAdmin && <AdminForm />}
            <CommitteeGuides />
            <Grid items={items} isAdmin={isAdmin} />'''
              s=s.replace(old,new,1)
              component='''function CommitteeGuides() {
  return (
    <section className="glass-strong rounded-2xl p-5 mb-6">
      <div className="flex items-center gap-3 mb-1">
        <FileText className="w-5 h-5 text-rose-gold" />
        <h2 className="font-serif text-2xl">MUN Committee Guides</h2>
      </div>
      <p className="text-xs text-muted-foreground mb-5">Separate PDF briefs explaining how each committee functions, its typical agenda and what delegates should know.</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {committeeGuides.map((c) => (
          <a key={c.code} href={`/mun-committee-pdfs/${c.code.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}.pdf`} target="_blank" rel="noreferrer" className="glass rounded-xl p-4 hover:border-rose-gold/40 transition group">
            <div className="text-[10px] font-mono uppercase tracking-widest text-rose-gold">{c.category}</div>
            <div className="font-serif text-lg mt-1 group-hover:text-rose-gold transition">{c.name}</div>
            <div className="text-xs text-muted-foreground mt-2">Open PDF</div>
          </a>
        ))}
      </div>
    </section>
  );
}

'''
              s=s.replace('function DebateForm(',component+'function DebateForm(',1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit generated PDFs and UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mun-committee-pdfs scripts src/routes/_authenticated/mun.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add MUN committee PDF guides"
          git push
